[package]
name = "eth_demo"
version.workspace = true
description = "SODA ETH demo harness — Sepolia value transfer via CPI to soda"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "eth_demo"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "soda/idl-build"]
# Build for Solana mainnet. Also switches soda::ID, which eth_demo checks
# before every CPI, so the two must always be built with the same flag.
mainnet = ["soda/mainnet"]

[dependencies]
anchor-lang = { workspace = true }
solana-program = { workspace = true }
soda = { path = "../soda", features = ["cpi"] }
