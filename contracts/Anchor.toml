[toolchain]
anchor_version = "0.32.1"
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

[programs.localnet]
eth_demo = "9JMr3TNHk2Mh7TQsaoxkfDmLFE3naYcAwcsgkKv3BBXx"
soda = "CPAEfBXpMMsUrjLNhDYxaCH79DYvFHJFC27fttnxAL1J"
sui_demo = "9LBE5dntoLRV61AM3W3ZHikgZPqZ5MLS4xCVvSxxbXug"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm --filter web test"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
ledger = ".anchor/test-ledger"
rpc_port = 8899

[[test.validator.clone]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
