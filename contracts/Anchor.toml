[toolchain]
# Anchor 0.32.1 otherwise resolves Solana 2.3.x, whose platform-tools v1.48
# ships Rust 1.84 — too old to parse dependencies that use edition2024
# (stabilized in Rust 1.85). Solana 3.1.10 ships platform-tools v1.52.
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

[programs.localnet]
eth_demo = "9g9eAkNbjpkVLi692vhgcUapJKS26yQTgsLzKbXKJXWM"
soda = "99apYWpnoMWwA2iXyJZcTMoTEag6tdFasjujdhdeG8b4"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm --filter web test"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
ledger = ".anchor/test-ledger"
rpc_port = 8899

[[test.validator.clone]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
